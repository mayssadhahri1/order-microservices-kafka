server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: orders
          uri: ${ORDER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/orders/**
        - id: products
          uri: ${INVENTORY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/products/**
        - id: notifications
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/notifications/**
      default-filters:
        # En-tête ajouté à chaque réponse pour savoir qu'elle est passée par la passerelle
        - AddResponseHeader=X-Gateway, order-platform

management:
  endpoints:
    web:
      exposure:
        include: health
